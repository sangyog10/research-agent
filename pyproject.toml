[project]
name = "langgraph-capstone"
version = "0.1.0"
description = "Day 21 capstone: two LangGraph agents - a human-in-the-loop research-to-email agent (CLI) and a research assistant (Streamlit)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ddgs>=9.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",
    "langgraph>=0.3.0",
    "python-dotenv>=1.0.1",
    "resend>=2.4.0",
    "streamlit>=1.40.0",
]

[project.scripts]
email-agent = "langgraph_capstone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_capstone"]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
