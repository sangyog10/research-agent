[project]
name = "day21-email-agent"
version = "0.1.0"
description = "LangGraph human-in-the-loop agent: research a topic, draft an email, approve it in Streamlit, send it."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ddgs>=9.0.0",
    "langchain-groq>=0.3.0",
    "langgraph>=0.3.0",
    "python-dotenv>=1.0.1",
    "resend>=2.4.0",
    "streamlit>=1.40.0",
]

[tool.uv]
# Plain scripts, not an installable library: `uv sync` only installs the
# dependencies, and `agent/` is imported straight from the project directory.
package = false

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
